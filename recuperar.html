<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova contrasenya - CF Sant Julià</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111827;
            color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            background-color: #1f2937;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #374151;
        }
        h2 { margin-top: 0; margin-bottom: 0.5rem; font-size: 1.5rem; }
        p { color: #9ca3af; font-size: 0.85rem; margin-bottom: 2rem; }
        
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        
        .btn-primario {
            width: 100%;
            padding: 0.75rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: background 0.2s;
        }
        .btn-primario:hover { background-color: #2563eb; }

        .btn-secundario {
            width: 100%;
            padding: 0.75rem;
            background-color: transparent;
            color: #10b981;
            border: 1px solid #10b981;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secundario:hover { background-color: rgba(16, 185, 129, 0.1); }
        
        .btn-enllac { background: none; border: none; color: #9ca3af; text-decoration: underline; cursor: pointer; font-size: 0.85rem; margin-top: 1.1rem; padding: 0.3rem; }
        .btn-enllac:hover { color: #f9fafb; }
        #mensaje { margin-top: 1.5rem; font-size: 0.9rem; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Nova contrasenya</h2>
        <p id="subtitol">Comprovant l'enllaç...</p>

        <form id="form-nova" onsubmit="desarContrasenya(event)" style="display:none;">
            <input type="email" id="email-ocult" name="email" autocomplete="username" style="display:none;" tabindex="-1">
            <input type="password" id="nova1" name="password" autocomplete="new-password" placeholder="Nova contrasenya (mínim 6 caràcters)">
            <input type="password" id="nova2" autocomplete="new-password" placeholder="Repeteix la nova contrasenya">
            <button type="submit" class="btn-primario" id="btn-desar">Desar la nova contrasenya</button>
        </form>

        <a href="index.html" class="btn-enllac" style="display:inline-block; text-decoration:underline;">Tornar a l'inici de sessió</a>
        <p id="mensaje" style="display:none;"></p>
    </div>

    <script>
        const urlSupa = 'https://gfpnyxwjllljjxdcadfy.supabase.co';
        const keySupa = 'sb_publishable_F2oufPKZ4W3dkTbLGdGZBw_xDQ6UIxQ';

        // Mateix emmagatzematge de sessió que la resta de l'app: en acabar, entrem ja dins
        const emmagatzematgeSessio = {
            getItem(k) { try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch (e) { return null; } },
            setItem(k, v) {
                try {
                    const recorda = localStorage.getItem('vestidor_recorda') !== 'no';
                    (recorda ? localStorage : sessionStorage).setItem(k, v);
                    (recorda ? sessionStorage : localStorage).removeItem(k);
                } catch (e) { try { sessionStorage.setItem(k, v); } catch (e2) {} }
            },
            removeItem(k) { try { localStorage.removeItem(k); } catch (e) {} try { sessionStorage.removeItem(k); } catch (e) {} }
        };
        const clienteSupabase = window.supabase.createClient(urlSupa, keySupa, {
            auth: { storage: emmagatzematgeSessio, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });

        const msg = document.getElementById('mensaje');
        const subtitol = document.getElementById('subtitol');
        let enllacValid = false;

        function mostrarFormulari(email) {
            enllacValid = true;
            subtitol.textContent = 'Escriu la nova contrasenya per a ' + (email || 'el teu compte') + '.';
            if (email) document.getElementById('email-ocult').value = email;
            document.getElementById('form-nova').style.display = 'block';
        }
        function enllacCaducat() {
            subtitol.textContent = '';
            msg.style.color = '#ef4444';
            msg.textContent = "Aquest enllaç no és vàlid o ha caducat. Torna a l'inici i prem \"He oblidat la contrasenya\" per rebre'n un de nou.";
            msg.style.display = 'block';
        }

        // Supabase avisa quan l'enllaç del correu és vàlid
        clienteSupabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && /type=recovery/.test(window.location.hash + window.location.search))) {
                mostrarFormulari(session && session.user && session.user.email);
            }
        });

        // Si l'enllaç ja ve amb error (caducat, ja utilitzat...), ho diem de seguida; si no, esperem uns segons l'avís de Supabase
        if (/error=|error_code=/.test(window.location.hash + window.location.search)) {
            enllacCaducat();
        } else {
            setTimeout(() => { if (!enllacValid) enllacCaducat(); }, 4000);
        }

        async function desarContrasenya(e) {
            e.preventDefault();
            const a = document.getElementById('nova1').value;
            const b = document.getElementById('nova2').value;
            msg.style.display = 'block';
            if (a.length < 6) { msg.style.color = '#ef4444'; msg.textContent = 'La contrasenya ha de tenir com a mínim 6 caràcters.'; return; }
            if (a !== b) { msg.style.color = '#ef4444'; msg.textContent = 'Les dues contrasenyes no coincideixen.'; return; }
            msg.style.color = '#f59e0b'; msg.textContent = 'Desant...';
            const { error } = await clienteSupabase.auth.updateUser({ password: a });
            if (error) {
                msg.style.color = '#ef4444';
                msg.textContent = /same|different/i.test(error.message) ? 'La nova contrasenya ha de ser diferent de l\'anterior.' : 'No s\'ha pogut desar: ' + error.message;
                return;
            }
            msg.style.color = '#10b981'; msg.textContent = 'Contrasenya canviada! Entrant al vestidor...';
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
        }
    </script>
</body>
</html>
